name: kpy-dfu
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4.3
  - r-essentials
  - bioconductor-limma=3.62.2
  - r-metafor=5.2.1
  - r-ggplot2=4.0.3
  - r-wgcna=1.74
  - bioconductor-edger=4.4.2
  - r-jsonlite=2.0.0
  - r-pheatmap
  # EPIC is not on CRAN; install from GitHub after environment creation:
  #   Rscript -e 'remotes::install_github("GfellerLab/EPIC")'
